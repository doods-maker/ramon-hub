######  Captain Agent Tools Configuration #######
# id: Tool identifier used to resolve the class (Captain::Tools::{PascalCase(id)}Tool)
# title: Human-readable tool name for frontend display
# description: Brief description of what the tool does
# icon: Icon name for frontend display (frontend icon system)
#######################################################

- id: add_contact_note
  title: 'Add Contact Note'
  description: 'Add a note to a contact profile'
  icon: 'note-add'

- id: add_private_note
  title: 'Add Private Note'
  description: 'Add a private note to a conversation (internal only)'
  icon: 'eye-off'

- id: update_priority
  title: 'Update Priority'
  description: 'Update conversation priority level'
  icon: 'exclamation-triangle'

- id: add_label_to_conversation
  title: 'Add Label to Conversation'
  description: 'Add a label to a conversation'
  icon: 'tag'

- id: faq_lookup
  title: 'FAQ Lookup'
  description: 'Busca textual nas FAQs aprovadas'
  icon: 'search'

- id: handoff
  title: 'Handoff to Human'
  description: 'Hand off the conversation to a human agent'
  icon: 'user-switch'

- id: buscar_processo_advbox
  title: 'Buscar processo no AdvBox'
  description: 'Busca processos no AdvBox por nome do cliente ou CPF'
  icon: 'search'

- id: consultar_dossie_advbox
  title: 'Consultar dossie no AdvBox'
  description: 'Dossie completo de um processo do AdvBox numa chamada so'
  icon: 'document'

- id: calcular_beneficio
  title: 'Calcular beneficio no motor'
  description: 'Calcula renda mensal e atrasados estimados do caso no motor de calculos'
  icon: 'calculator'

- id: checar_prescricao
  title: 'Checar prescricao'
  description: 'Prescricao quinquenal do caso: parcelas ja perdidas e meses ate o corte'
  icon: 'clock'

- id: linha_da_vida
  title: 'Linha da vida da pessoa'
  description: 'Todos os casos da pessoa no hub e os marcos etarios que ainda vencem'
  icon: 'timeline'

- id: documentacao_faltante
  title: 'O que falta no caso'
  description: 'Documentos pendentes, lacunas da colheita e tarefas em aberto do caso'
  icon: 'clipboard'

- id: preparar_contrato_zapsign
  title: 'Preparar contrato no ZapSign'
  description: 'Sugere gerar contrato + procuracao no ZapSign (o humano aprova antes)'
  icon: 'signature'

- id: preparar_caso_advbox
  title: 'Abrir caso no AdvBox'
  description: 'Sugere abrir cliente, caso e primeira tarefa no AdvBox (o humano aprova antes)'
  icon: 'briefcase'

- id: agendar_reuniao
  title: 'Agendar reuniao'
  description: 'Sugere data da reuniao de fechamento; aprovada, vira tarefa na Esteira'
  icon: 'calendar'

- id: mover_etapa
  title: 'Mover de etapa'
  description: 'Sugere mover o caso para outra etapa do funil (o humano aprova antes)'
  icon: 'columns'

- id: playbook_da_tese
  title: 'Playbook da tese'
  description: 'Criterios, objecoes, apresentacao, documentos e honorario de uma tese'
  icon: 'clipboard'

- id: simular_honorario
  title: 'Simular honorario'
  description: 'Honorario estimado pela regra da tese sobre atrasados e mensal'
  icon: 'calculator'

- id: historico_do_contato
  title: 'Historico do contato'
  description: 'Casos, conversas e notas anteriores da pessoa no hub'
  icon: 'timeline'

- id: link_agendamento
  title: 'Link de agendamento'
  description: 'Link para o lead escolher dia e horario da conversa'
  icon: 'calendar'

- id: agenda_do_escritorio
  title: 'Agenda do dia'
  description: 'Reunioes, tarefas do hub (do dia e atrasadas) e prazos do AdvBox no dia'
  icon: 'calendar'

- id: funil_hoje
  title: 'Funil de hoje'
  description: 'Meta do dia, conversao por etapa com gargalo, SLA e perdas por tese'
  icon: 'columns'

- id: publicacoes_advbox
  title: 'Publicacoes do processo no AdvBox'
  description: 'Ultimas publicacoes de um processo do AdvBox (data e trecho)'
  icon: 'document'

- id: registrar_qualificacao
  title: 'Registrar qualificação'
  description: 'Marca no caso se um critério de qualificação da tese foi confirmado ou não atendido'
  icon: 'checkmark-circle'

- id: criar_tarefa_cadencia
  title: 'Criar tarefa de cadência'
  description: 'Cria um lembrete interno na Esteira do caso (cobrar, retomar, ligar) com data e hora'
  icon: 'calendar-clock'

- id: solicitar_documento
  title: 'Pedir documentos'
  description: 'Texto pronto pedindo ao cliente os documentos pendentes do caso'
  icon: 'document-add'

- id: enviar_link_portal
  title: 'Link do portal do cliente'
  description: 'Link seguro para o cliente enviar documentos pelo celular, com frase pronta'
  icon: 'link'

- id: marcar_perdido
  title: 'Marcar como perdido'
  description: 'Sugere marcar o caso como perdido com o motivo — o humano aprova no Cockpit'
  icon: 'dismiss-circle'
