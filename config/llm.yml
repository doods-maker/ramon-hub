  deepseek-chat:
    provider: deepseek
    display_name: 'DeepSeek Chat'
    credit_multiplier: 1
  deepseek-v4-flash:
    provider: deepseek
    display_name: 'DeepSeek V4 Flash'
    credit_multiplier: 1
  deepseek-v4-pro:
