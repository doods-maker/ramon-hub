    credit_multiplier: 2
  claude-sonnet-4-6:
    provider: anthropic
    display_name: 'Claude Sonnet 4.6'
    credit_multiplier: 3
  # Assinatura do Claude (runner da VPS): fora de toda feature — só o agente
  # @claude do gestor (termos de uso; trava em Ramon::LlmEscolha e CaptainFeaturable).
  claude-vps:
    provider: claude_vps
    display_name: 'Claude da VPS (assinatura)'
    credit_multiplier: 0

