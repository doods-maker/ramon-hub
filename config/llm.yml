      [
        deepseek-chat,
        deepseek-v4-flash,
        deepseek-v4-pro,
        claude-haiku-4-5,
        claude-sonnet-4-6,
        gpt-4.1-mini,
        gpt-5-mini,
        gpt-4.1,
        gpt-5.1,
        gpt-5.2,
