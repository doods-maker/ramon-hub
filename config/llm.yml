        claude-sonnet-4.5,
        gemini-3-flash,
        gemini-3-pro,
      ]
    default: gpt-5.1
  copilot:
    models:
      [
        deepseek-chat,
        deepseek-v4-flash,
        deepseek-v4-pro,
        claude-haiku-4-5,
        claude-sonnet-4-6,
        gpt-4.1-mini,
        gpt-5-mini,
